name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ang-ee/angee-django/.github/workflows/reusable-checks.yml@main
    secrets: inherit
    with:
      python-version: "3.14"
      # The suite composes example.notes and reads the composed SDL, so
      # pytest runs in the stack lane (no hermetic standalone run exists).
      uv-enabled: false
      # The fragments' @angee/gql fixture is the stack root's composed
      # runtime/, so the composed-stack lane owns typecheck/test + pytest;
      # the bespoke sibling-checkout lanes are gone with the example host.
      pnpm-enabled: false
      stack-enabled: true
